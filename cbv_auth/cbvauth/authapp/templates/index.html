<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f5f5;
        }

        .container{
            background:#fff;
            padding:40px;
            width:350px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:gray;
            margin-bottom:30px;
        }

        .btn{
            display:block;
            width:100%;
            padding:12px;
            margin:10px 0;
            text-decoration:none;
            border-radius:6px;
            font-size:18px;
            color:white;
        }

        .login{
            background:#007bff;
        }

        .signup{
            background:#28a745;
        }

        .btn:hover{
            opacity:.9;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Welcome</h1>
    <p>Choose an option</p>

    <a href="{% url 'login' %}" class="btn login">Login</a>

    <a href="{% url 'register' %}" class="btn signup">Sign Up</a>

</div>

</body>
</html>
